# ==============================================================================
# PR Auto-Labeler Rules
# ==============================================================================

"area: backend":
  - changed-files:
      - any-glob-to-any-file: "apps/server/**"

"area: frontend":
  - changed-files:
      - any-glob-to-any-file: "apps/client/**"

"area: packages":
  - changed-files:
      - any-glob-to-any-file: "packages/**"

"area: payments":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/server/src/modules/payment/**"
          - "apps/server/src/modules/checkout/**"
          - "apps/client/src/features/checkout/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

"area: infra":
  - changed-files:
      - any-glob-to-any-file:
          - "docker/**"
          - "terraform/**"
          - "k8s/**"
          - ".github/**"
          - "scripts/**"
